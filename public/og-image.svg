<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#050706"/>
  <rect x="20" y="20" width="1160" height="590" rx="20" stroke="#1A3025" stroke-width="2"/>
  
  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#1A3025" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
  </g>

  <!-- Restrained Emerald Ambient Light -->
  <circle cx="1000" cy="200" r="300" fill="#00C878" fill-opacity="0.06"/>

  <!-- Content -->
  <g transform="translate(80, 100)">
    <!-- Eyebrow Pill -->
    <rect width="450" height="36" rx="18" fill="#0D1712" stroke="#1A3025"/>
    <text x="20" y="23" font-family="monospace" font-size="13" font-weight="bold" fill="#00C878" letter-spacing="2">
      BUSINESS DEVELOPMENT • OUTSOURCING
    </text>

    <!-- Main Title -->
    <text x="0" y="100" font-family="sans-serif" font-size="56" font-weight="bold" fill="#F4F7F5">
      VIVEK BANDARI
    </text>

    <!-- Subtitle -->
    <text x="0" y="150" font-family="sans-serif" font-size="28" font-weight="600" fill="#00C878">
      Business Development Manager
    </text>

    <!-- Description -->
    <text x="0" y="210" font-family="sans-serif" font-size="22" fill="#9AA7A0">
      Turning Business Requirements Into Scalable Outsourcing Solutions.
    </text>
    <text x="0" y="245" font-family="sans-serif" font-size="20" fill="#6F7E76">
      Alboriss Pvt. Ltd. • Hyderabad, Telangana, India
    </text>

    <!-- Capabilities Bar -->
    <g transform="translate(0, 320)">
      <rect width="840" height="50" rx="12" fill="#0D1712" stroke="#1A3025"/>
      <text x="24" y="32" font-family="monospace" font-size="14" fill="#E3ECE6">
        BANKING  •  HEALTHCARE  •  IT  •  DIGITAL  •  AI  •  CONSULTING  •  INFRA  •  ROBOTICS
      </text>
    </g>
  </g>
</svg>
